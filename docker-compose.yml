version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      DB_PATH: /app/data/auth.sqlite
      UPLOADS_DIR: /app/uploads
    volumes:
      - auth-db:/app/data
      - uploads-data:/app/uploads
    networks:
      - backend
    depends_on:
      - rabbitmq

  post-service:
    build:
      context: ./post-service
      dockerfile: Dockerfile
    container_name: post-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      DB_PATH: /app/data/post.sqlite
      UPLOADS_DIR: /app/uploads
      AUTH_SERVICE_URL: http://auth-service:3001
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
    volumes:
      - post-db:/app/data
      - uploads-data:/app/uploads
    networks:
      - backend
    depends_on:
      - rabbitmq
      - auth-service

  comment-service:
    build:
      context: ./comment-service
      dockerfile: Dockerfile
    container_name: comment-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      DB_PATH: /app/data/comment.sqlite
      UPLOADS_DIR: /app/uploads
      AUTH_SERVICE_URL: http://auth-service:3001
      POST_SERVICE_URL: http://post-service:3002
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
    volumes:
      - comment-db:/app/data
      - uploads-data:/app/uploads
    networks:
      - backend
    depends_on:
      - rabbitmq
      - auth-service
      - post-service

  social-service:
    build:
      context: ./social-service
      dockerfile: Dockerfile
    container_name: social-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      DB_PATH: /app/data/social.sqlite
      AUTH_SERVICE_URL: http://auth-service:3001
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
    volumes:
      - social-db:/app/data
    networks:
      - backend
    depends_on:
      - rabbitmq
      - auth-service

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - uploads-data:/var/www/uploads:ro
    networks:
      - backend
    depends_on:
      - auth-service
      - post-service
      - comment-service
      - social-service
    restart: always

volumes:
  auth-db:
  post-db:
  comment-db:
  social-db:
  uploads-data:

networks:
  backend:
    driver: bridge
